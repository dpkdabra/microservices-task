apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
      - name: order-service
        image: dpkdabra/order-service:latest

        ports:
        - containerPort: 3002

        env:
        - name: USER_SERVICE_URL
          value: "http://user-service:3000"

        - name: PRODUCT_SERVICE_URL
          value: "http://product-service:3001"

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "256Mi"
            cpu: "250m"

     
